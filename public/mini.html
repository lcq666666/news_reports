<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日新闻播报 · 小程序版</title>
<style>
  /* Local v2, 2026-11-04 (user-approved local spec, NOT pushed):
     - Home: one LARGE card per section (not a small card with two
       titles). Click a card -> section sub-page -> news cards.
       Click a title -> detail sub-page: content, then a References
       section (original link + source + a title search for more
       coverage), prev/next card switching, play this item.
     - Honest detail: today's items each have only one url and one
       source string, and image_url is null for all 58, so no
       invented references or images. An image is shown ONLY when
       the item really carries image_url (HelloGitHub monthly picks
       below do, from the issue page itself). Stored archive is the
       feed excerpt (<=800 chars), never scraped full text.
     - Tools: no fixed 8-item cap in the UI; today's 4 edition items
       plus a labelled HelloGitHub monthly section (issue 127,
       2026-10-28, monthly, NOT today's news).
     - 5 themes are deliberately different layouts, not just colours:
       magazine (hero, serif, staggered grid, fade-slide),
       newspaper (hairlines, square corners, small caps, one column),
       dark (dark, monospace, glow, slide),
       light-card (rounded, soft shadow, spring lift),
       podcast (vertical timeline, prominent player).
     - Data: same-origin /data/<date>.json only. On Pages BASE is
       /news_reports; locally (localhost server root = public/) it
       is empty, so fetch "data/<date>.json". Never file://. */
  :root { color-scheme: light; }
  [data-theme="magazine"] { --bg: #faf6ef; --surface: #fffdf8; --text: #26221c; --muted: #7a7264; --border: #e5ddcc; --accent: #b91c1c; --font-head: "Noto Serif SC", Georgia, serif; --font-body: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; --radius: 16px; --shadow: none; }
  [data-theme="newspaper"] { --bg: #fdfdf8; --surface: #ffffff; --text: #111111; --muted: #555555; --border: #111111; --accent: #111111; --font-head: Georgia, "Noto Serif SC", serif; --font-body: Georgia, "Noto Serif SC", serif; --radius: 0px; --shadow: none; }
  [data-theme="dark"] { color-scheme: dark; --bg: #0d1117; --surface: #161b22; --text: #e6edf3; --muted: #8b949e; --border: #30363d; --accent: #58a6ff; --font-head: ui-monospace, "SF Mono", Menlo, monospace; --font-body: ui-monospace, "SF Mono", Menlo, monospace; --radius: 8px; --shadow: 0 0 24px rgba(88,166,255,.15); }
  [data-theme="light-card"] { --bg: #f0f4f8; --surface: #ffffff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --accent: #7c3aed; --font-head: system-ui, -apple-system, "PingFang SC", sans-serif; --font-body: system-ui, -apple-system, "PingFang SC", sans-serif; --radius: 20px; --shadow: 0 4px 20px rgba(0,0,0,.08); }
  [data-theme="podcast"] { --bg: #fff7ed; --surface: #ffffff; --text: #292524; --muted: #78716c; --border: #fed7aa; --accent: #ea580c; --font-head: system-ui, -apple-system, "PingFang SC", sans-serif; --font-body: system-ui, -apple-system, "PingFang SC", sans-serif; --radius: 12px; --shadow: none; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.7; font-family: var(--font-body); font-size: clamp(1rem, .93rem + .38vw, 1.125rem); transition: background .3s, color .3s; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .kicker { font-size: 12px; letter-spacing: .15em; color: var(--muted); text-transform: uppercase; }
  h1 { font-family: var(--font-head); font-size: clamp(1.875rem, 1.5rem + 1.88vw, 2.5rem); line-height: 1.25; margin: 8px 0 0; }
  .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
  label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  select { margin-left: 8px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 14px; max-width: 170px; }
  .player { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 20px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  [data-theme="podcast"] .player { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
  .player button { background: none; border: none; color: var(--text); font-size: 14px; cursor: pointer; padding: 4px 2px; }
  .player button.primary { color: var(--accent); font-weight: 700; }
  .player .now { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .notice { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .daynav { display: flex; gap: 16px; margin-top: 24px; font-size: 14px; }
  .daynav button { background: none; border: none; color: var(--accent); font-size: 14px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 4px; }
  .daynav button:disabled { color: var(--muted); text-decoration: none; cursor: default; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
  @media (min-width: 560px) {
    [data-theme="magazine"] .grid, [data-theme="dark"] .grid, [data-theme="light-card"] .grid { grid-template-columns: 1fr 1fr; }
    [data-theme="magazine"] .grid .card:first-child { grid-column: 1 / -1; }
  }
  [data-theme="podcast"] .grid { border-left: 3px solid var(--accent); padding-left: 20px; margin-left: 8px; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 24px; cursor: pointer; box-shadow: var(--shadow); animation: cardIn .45s ease both; }
  [data-theme="magazine"] .card { animation-name: fadeSlide; }
  [data-theme="dark"] .card { animation-name: slideIn; }
  [data-theme="light-card"] .card { transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s; }
  [data-theme="light-card"] .card:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 12px 32px rgba(0,0,0,.14); }
  [data-theme="newspaper"] .card { animation: none; border-width: 1px 1px 3px 1px; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; } to { opacity: 1; } }
  .card.hero h3 { font-size: clamp(1.5rem, 1.28rem + 1.10vw, 2rem); }
  .card h3 { font-family: var(--font-head); font-size: clamp(1.125rem, 1.02rem + .53vw, 1.3125rem); line-height: 1.4; margin: 8px 0 0; }
  .card p { color: var(--muted); font-size: 15px; margin: 8px 0 0; }
  .card .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .05em; }
  .card .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  [data-theme="newspaper"] .card .dot { border-radius: 0; }
  .card .go { margin-top: 14px; font-size: 14px; font-weight: 700; color: var(--accent); }
  .card img { width: 100%; border-radius: calc(var(--radius) - 4px); margin-top: 12px; display: block; }
  .back { background: none; border: none; color: var(--accent); font-size: 14px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .actions button, .actions a { color: var(--accent); background: none; border: none; font-size: 14px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 4px; }
  .actions a { color: var(--muted); }
  .refs { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border); }
  .refs .label { font-size: 12px; letter-spacing: .05em; color: var(--muted); text-transform: uppercase; }
  .refs ul { margin: 12px 0 0; padding-left: 20px; color: var(--muted); font-size: 15px; }
  .refs a { color: var(--accent); word-break: break-all; }
  .detail-excerpt { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
  .detail-excerpt .label { font-size: 12px; letter-spacing: .05em; color: var(--muted); }
  .detail-excerpt p { color: var(--muted); margin-top: 12px; }
  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); text-align: center; }
  footer a { color: var(--muted); }
  .skeleton { position: relative; overflow: hidden; background: var(--border); border-radius: 6px; height: 16px; margin: 12px 0; }
  .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: shimmer 1.5s infinite; }
  @keyframes shimmer { to { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body data-theme="magazine">
<div class="wrap">
  <header>
    <div>
      <div class="kicker">NEWS_REPORTS · 每日 07:30 更新</div>
      <h1>每日新闻播报</h1>
      <div class="sub" id="subtitle">正在读取最新一期…</div>
    </div>
    <label for="theme-select">主题
      <select id="theme-select" aria-label="切换主题">
        <option value="magazine">杂志大图（默认）</option>
        <option value="newspaper">头版日报</option>
        <option value="dark">暗夜极客</option>
        <option value="light-card">轻量卡片</option>
        <option value="podcast">播客时间线</option>
      </select>
    </label>
  </header>

  <div class="player" role="region" aria-label="今日播报">
    <strong>🎧 今日播报</strong>
    <button id="btn-prev" aria-label="上一条">⏮ 上一条</button>
    <button id="btn-play" class="primary" aria-label="播放全部">▶ 播放全部</button>
    <button id="btn-next" aria-label="下一条">下一条 ⏭</button>
    <label for="rate-select">倍速
      <select id="rate-select" aria-label="播报倍速">
        <option value="0.75">0.75x</option>
        <option value="1">1x</option>
        <option value="1.2" selected>1.2x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </label>
    <label for="voice-select">音色
      <select id="voice-select" aria-label="朗读音色">
        <option value="auto">自动优选</option>
      </select>
    </label>
    <span class="now" id="now"></span>
  </div>
  <div class="notice" id="notice"></div>

  <div class="daynav">
    <button id="btn-prevday">← 前一天</button>
    <button id="btn-nextday" disabled>后一天 →</button>
  </div>

  <main id="main">
    <div class="skeleton"></div><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:50%"></div>
  </main>

  <footer>
    详情页为来源导读存档，不全文搬运；完整内容请见原文链接。本页与网站版同一次发布、同一份数据。
    <br><a href="./">网页版完整页面 ↗</a>
  </footer>
</div>

<script>
(function () {
  var COLORS = { politics: "#B91C1C", military: "#14532D", current: "#EA580C", research: "#2563EB", "large-models": "#7C3AED", ai: "#0F766E", tools: "#92400E" };
  var SECTION_DESC = {
    politics: "政坛动向与政策信号",
    military: "防务动态与军事观察",
    current: "正在发生的时事",
    research: "科研进展与学术动态",
    "large-models": "大模型发布与行业动向",
    ai: "人工智能应用与讨论",
    tools: "好用的项目、工具与资源，不限量"
  };
  // HelloGitHub monthly picks, labelled as monthly (NOT today's news).
  // Verified 2026-11-04: RSS https://hellogithub.com/rss, latest issue
  // 127, published 2026-10-28. Descriptions below are short summaries
  // of the issue page itself; images are the issue page's own images.
  var HG_PICKS = [
    { title: "Filee · 离线文件格式转换器", summary: "按住 Ctrl 拖动文件，光标旁弹出格式圆环，放到目标格式即完成转换，支持 200 多种格式，文件全程不上传。", url: "https://hellogithub.com/periodical/volume/127", source: "HelloGitHub 第 127 期（月刊，2026-10-28）", image_url: "https://img-global.cheatsheet.store/i/WtL0ZjK9AeU3vdo_1792741211.jpg" },
    { title: "omni-tools · 可自托管的全能在线工具箱", summary: "图片、音视频、PDF、文本、日期时间、数学计算等日常工具集合，所有文件都在本地浏览器中处理。", url: "https://hellogithub.com/periodical/volume/127", source: "HelloGitHub 第 127 期（月刊，2026-10-28）", image_url: "https://img-global.cheatsheet.store/i/2QeJjvZhLWdbo3I_1792849243.png" },
    { title: "magpie · 一键切换 AI 编程助手的模型", summary: "通过本地网关转换接口格式，让不同编程助手用上不同厂商的模型，额度用完后自动切换账号。", url: "https://hellogithub.com/periodical/volume/127", source: "HelloGitHub 第 127 期（月刊，2026-10-28）", image_url: "https://img-global.cheatsheet.store/i/yabu8ZKGAxBz5o4_1792766512.png" },
    { title: "miniserve · 极简的共享文件 HTTP 服务器", summary: "一个文件就能通过 HTTP 共享文件和目录，支持认证、上传、打包下载、搜索、扫码访问和 WebDAV。", url: "https://hellogithub.com/periodical/volume/127", source: "HelloGitHub 第 127 期（月刊，2026-10-28）", image_url: "https://img-global.cheatsheet.store/i/CW0eI7EM62BsUfQ_1792929788.png" },
    { title: "PicLite · 极简的本地图片压缩工具", summary: "批量压缩、拖动对比画质、格式转换、缩放和水印，自动比较候选结果选出体积更小的文件，全程本机处理。", url: "https://hellogithub.com/periodical/volume/127", source: "HelloGitHub 第 127 期（月刊，2026-10-28）", image_url: "https://img-global.cheatsheet.store/i/6aeiVF3K7w5c4Ux_1792935209.jpg" }
  ];
  var BASE = location.pathname.indexOf("/news_reports") === 0 ? "/news_reports" : "";
  var state = { data: null, date: null, view: { type: "home" }, index: 0, playing: false, rate: 1.2, voice: "auto", chunk: 0, timer: null, noticed: false };

  function beijingDate(offsetDays) {
    var d = new Date(Date.now() + 8 * 3600 * 1000 + offsetDays * 86400000);
    return d.toISOString().slice(0, 10);
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function showNotice(msg) { document.getElementById("notice").textContent = msg; }
  function setSubtitle() {
    document.getElementById("subtitle").textContent = state.date
      ? state.date + " · 政治 / 军事 / 时事 / 科研 / 大模型 / 人工智能 / 今日值得一试"
      : "正在读取最新一期…";
  }
  async function loadDate(dateStr) {
    var urls = [BASE + "/data/" + dateStr + ".json"];
    if (BASE) urls.push("data/" + dateStr + ".json");
    for (var i = 0; i < urls.length; i++) {
      try {
        var ctrl = new AbortController();
        var to = setTimeout(function () { ctrl.abort(); }, 10000);
        var r = await fetch(urls[i], { signal: ctrl.signal });
        clearTimeout(to);
        if (!r.ok) continue;
        var j = await r.json();
        if (!j || !j.sections) continue;
        return j;
      } catch (e) {}
    }
    return null;
  }
  async function loadLatest() {
    var main = document.getElementById("main");
    for (var off = 0; off >= -3; off--) {
      var d = beijingDate(off);
      var j = await loadDate(d);
      if (j) { state.data = j; state.date = j.date || d; state.index = 0; state.view = { type: "home" }; render(); return; }
    }
    main.innerHTML = "<p>新闻数据没能加载出来（同站数据未找到）。请检查网络后重试。</p><p><button id=\"retry\" style=\"padding:8px 20px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text);font-size:16px;cursor:pointer;\">重试</button></p>";
    document.getElementById("retry").onclick = loadLatest;
    document.getElementById("subtitle").textContent = "加载失败";
  }
  function flat() {
    var out = [];
    (state.data.sections || []).forEach(function (s) {
      (s.items || []).forEach(function (it) { out.push(Object.assign({}, it, { sectionName: s.name })); });
    });
    return out;
  }
  function goView(v) { state.view = v; try { window.scrollTo(0, 0); } catch (e) {} render(); }
  function imgTag(item) {
    return item.image_url ? '<img src="' + esc(item.image_url) + '" alt="" loading="lazy">' : "";
  }
  function render() {
    setSubtitle();
    var sections = state.data.sections || [];
    var main = document.getElementById("main");
    var items = flat();
    var html = "";
    if (state.view.type === "category") {
      var s = sections.find(function (x) { return x.id === state.view.id; });
      if (!s) { goView({ type: "home" }); return; }
      var color = COLORS[s.id] || "#374151";
      html += '<p style="margin-top:24px"><button class="back" id="back-home">← 全部板块</button></p>';
      html += '<h2 style="font-family:var(--font-head);font-size:clamp(1.5rem,1.28rem + 1.10vw,2rem);margin:16px 0 0">' + esc(s.name) + ' <span style="font-size:14px;font-weight:400;color:var(--muted)">' + (s.items || []).length + " 条</span></h2>";
      html += '<p style="color:var(--muted);font-size:14px">' + esc(SECTION_DESC[s.id] || "") + "</p>";
      html += '<div class="grid">';
      (s.items || []).forEach(function (it) {
        var isCurrent = items[state.index] && items[state.index].id === it.id;
        html += '<article class="card" data-detail="' + esc(it.id) + '"><div class="meta" style="color:' + color + '"><span class="dot" style="background:' + color + '"></span>' + esc(s.name) + (isCurrent && state.playing ? '<span style="color:var(--muted)">· 正在播报</span>' : "") + "</div>";
        html += "<h3>" + esc(it.title) + "</h3>" + imgTag(it) + "<p>" + esc(it.summary || "") + '</p><div class="go">查看详情 →</div>';
        html += '<div class="actions"><button data-play="' + esc(it.id) + '">' + (isCurrent && state.playing ? "暂停播报" : "播报本条") + '</button><a href="' + esc(it.url) + '" target="_blank" rel="noreferrer">原文 ↗</a><span>来源：' + esc(it.source || "") + "</span></div></article>";
      });
      if (s.id === "tools") {
        html += '<div style="grid-column:1 / -1;margin-top:8px"><h3 style="font-family:var(--font-head)">HelloGitHub 月刊精选 · 第 127 期（2026-10-28，月刊，非当日新闻）</h3><p style="color:var(--muted);font-size:14px">以下 5 条来自已核实的 HelloGitHub 月刊最新一期，单独标注，不计入今日 58 条。</p></div>';
        HG_PICKS.forEach(function (it) {
          html += '<article class="card" data-hg="1"><div class="meta" style="color:' + color + '"><span class="dot" style="background:' + color + '"></span>月刊精选</div><h3>' + esc(it.title) + "</h3>" + imgTag(it) + "<p>" + esc(it.summary) + '</p><div class="actions"><a href="' + esc(it.url) + '" target="_blank" rel="noreferrer">HelloGitHub 第 127 期 ↗</a><span>来源：' + esc(it.source) + "</span></div></article>";
        });
      }
      html += "</div>";
    } else if (state.view.type === "detail") {
      var item = items.find(function (f) { return f.id === state.view.itemId; });
      if (!item) { goView({ type: "home" }); return; }
      var sec = sections.find(function (x) { return x.id === item.category; });
      var sibs = sec ? (sec.items || []) : [];
      var pos = sibs.findIndex(function (x) { return x.id === item.id; });
      var prev = pos > 0 ? sibs[pos - 1] : null;
      var next = pos >= 0 && pos < sibs.length - 1 ? sibs[pos + 1] : null;
      var c2 = COLORS[item.category] || "#374151";
      var isCur = items[state.index] && items[state.index].id === item.id;
      var ex = (item.excerpt || "").trim();
      var searchUrl = "https://www.bing.com/search?q=" + encodeURIComponent(item.title);
      html += '<p style="margin-top:24px;display:flex;gap:16px"><button class="back" id="back-home">← 全部板块</button><button class="back" id="back-cat">← ' + esc(sec ? sec.name : "返回板块") + "</button></p>";
      html += '<article class="card" style="cursor:default;margin-top:16px"><div class="meta" style="color:' + c2 + '"><span class="dot" style="background:' + c2 + '"></span>' + esc(item.sectionName || item.category) + '<span style="color:var(--muted)">· 来源：' + esc(item.source || "") + " · " + esc(state.date || "") + "</span></div>";
      html += '<h2 style="font-family:var(--font-head);font-size:clamp(1.5rem,1.28rem + 1.10vw,2rem);margin:12px 0 0">' + esc(item.title) + "</h2>" + imgTag(item);
      html += '<p style="font-weight:700;color:var(--text);margin-top:16px">' + esc(item.summary || "") + "</p>";
      html += '<div class="detail-excerpt"><div class="label">站内存档导读（来源导读存档，非全文）</div>';
      if (ex && ex.length > 80 && ex !== item.summary) html += "<p>" + esc(ex) + "</p>";
      else html += "<p>本条暂无更长的来源导读存档，以上摘要即为本站存档内容。完整内容请见原文。</p>";
      html += "</div>";
      html += '<div class="refs"><div class="label">引用 · 这条新闻的依据与来源</div><ul>';
      html += '<li>原文链接：<a href="' + esc(item.url) + '" target="_blank" rel="noreferrer">' + esc(item.url) + "</a></li>";
      html += "<li>来源： " + esc(item.source || "") + "</li>";
      html += '<li>更多报道检索（按标题检索，不作为证据本身）：<a href="' + esc(searchUrl) + '" target="_blank" rel="noreferrer">以标题检索更多渠道 ↗</a></li>';
      html += "</ul><p style=\"color:var(--muted);font-size:14px\">今天的数据每条只有一个原文链接和一个来源字符串，本页不编造更多引用；有多个渠道时会在这里逐条列出。</p></div>";
      html += '<div class="actions" style="margin-top:20px"><button data-play="' + esc(item.id) + '">' + (isCur && state.playing ? "暂停播报" : "播报本条") + '</button><a href="' + esc(item.url) + '" target="_blank" rel="noreferrer">原文 ↗</a></div></article>';
      html += '<p style="display:flex;flex-wrap:wrap;gap:16px;margin-top:24px;font-size:14px"><button class="back" id="prev-card" ' + (prev ? "" : "disabled") + '>← 上一张卡片</button><button class="back" id="next-card" ' + (next ? "" : "disabled") + '>下一张卡片 →</button><span style="color:var(--muted)">' + (pos >= 0 ? (pos + 1) + " / " + sibs.length : "") + "</span></p>";
      html += "<script type=\"application/json\" id=\"detail-nav\">" + JSON.stringify({ prev: prev ? prev.id : null, next: next ? next.id : null, cat: item.category }) + "<\/script>";
    } else {
      html += '<p style="color:var(--muted);font-size:14px;margin-top:24px">一张大卡片就是一个板块，点卡片进板块子页，再点标题进详情子页，详情末尾有引用区。</p>';
      html += '<div class="grid">';
      // Home order only (user 2026-11-04 20:06): tools first as the
      // hero card, politics demoted to a normal card, other sections
      // keep their original order. Playback/flat order is untouched.
      var homeSections = sections.slice().sort(function (a, b) {
        if (a.id === "tools") return -1;
        if (b.id === "tools") return 1;
        return 0;
      });
      homeSections.forEach(function (s, idx) {
        var col = COLORS[s.id] || "#374151";
        var its = s.items || [];
        html += '<article class="card' + (idx === 0 ? " hero" : "") + '" data-cat="' + esc(s.id) + '"><div class="meta" style="color:' + col + '"><span class="dot" style="background:' + col + '"></span>' + esc(s.name) + '<span style="color:var(--muted)">' + its.length + " 条</span></div>";
        html += '<h3>' + esc(s.name) + "</h3><p>" + esc(SECTION_DESC[s.id] || "") + "</p>";
        its.slice(0, 3).forEach(function (it) { html += "<p>· " + esc(it.title) + "</p>"; });
        html += '<div class="go">进入板块 →</div></article>';
      });
      html += "</div>";
    }
    main.innerHTML = html || "<p>本期暂无内容。</p>";
    var bh = document.getElementById("back-home");
    if (bh) bh.onclick = function () { goView({ type: "home" }); };
    var bc = document.getElementById("back-cat");
    if (bc) bc.onclick = function () { var nav = JSON.parse(document.getElementById("detail-nav").textContent); goView({ type: "category", id: nav.cat }); };
    var pc = document.getElementById("prev-card");
    if (pc) pc.onclick = function () { var nav = JSON.parse(document.getElementById("detail-nav").textContent); if (nav.prev) goView({ type: "detail", itemId: nav.prev }); };
    var nc = document.getElementById("next-card");
    if (nc) nc.onclick = function () { var nav = JSON.parse(document.getElementById("detail-nav").textContent); if (nav.next) goView({ type: "detail", itemId: nav.next }); };
    main.querySelectorAll("[data-cat]").forEach(function (el) {
      el.onclick = function () { goView({ type: "category", id: el.getAttribute("data-cat") }); };
    });
    main.querySelectorAll("[data-detail]").forEach(function (el) {
      el.onclick = function (e) {
        if (e.target.closest("[data-play]") || e.target.closest("a")) return;
        goView({ type: "detail", itemId: el.getAttribute("data-detail") });
      };
    });
    main.querySelectorAll("[data-play]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var idx = items.findIndex(function (f) { return f.id === b.getAttribute("data-play"); });
        if (idx >= 0) playAt(idx);
      };
    });
    updateNow();
  }
  function updateNow() {
    var items = flat();
    var cur = items[state.index];
    document.getElementById("now").textContent = cur ? (state.index + 1) + "/" + items.length + " · " + cur.title : "";
    document.getElementById("btn-play").textContent = state.playing ? "⏸ 暂停" : "▶ 播放全部";
    var nextBtn = document.getElementById("btn-nextday");
    nextBtn.disabled = !state.date || state.date >= beijingDate(0);
  }
  function pickVoice() {
    try {
      var voices = speechSynthesis.getVoices() || [];
      if (state.voice !== "auto") { var c = voices.find(function (v) { return v.name === state.voice; }); if (c) return c; }
      var zh = voices.filter(function (v) { return (v.lang || "").toLowerCase().indexOf("zh") === 0; });
      if (!zh.length) return null;
      function score(v) {
        var n = (v.name || "").toLowerCase();
        if (n.indexOf("xiaoxiao") >= 0) return 100;
        if (n.indexOf("yunyang") >= 0 || n.indexOf("yunxia") >= 0) return 90;
        if (n.indexOf("natural") >= 0 || n.indexOf("neural") >= 0) return 80;
        if (n.indexOf("google") >= 0) return 70;
        if (n.indexOf("microsoft") >= 0) return 60;
        return 10;
      }
      return zh.slice().sort(function (a, b) { return score(b) - score(a); })[0];
    } catch (e) { return null; }
  }
  function loadVoices() {
    try {
      var sel = document.getElementById("voice-select");
      var cur = sel.value;
      sel.innerHTML = '<option value="auto">自动优选</option>';
      (speechSynthesis.getVoices() || []).filter(function (v) { return (v.lang || "").toLowerCase().indexOf("zh") === 0; })
        .forEach(function (v) { var o = document.createElement("option"); o.value = v.name; o.textContent = v.name; sel.appendChild(o); });
      sel.value = cur;
    } catch (e) {}
  }
  function splitSentences(text) {
    var parts = (text || "").split(/(?<=[。！？；])/g).map(function (s) { return s.trim(); }).filter(Boolean);
    var chunks = [];
    parts.forEach(function (p) {
      if (p.length <= 60) chunks.push(p);
      else p.split(/(?<=，)/g).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (c) { chunks.push(c); });
    });
    return chunks.length ? chunks : [text];
  }
  function stopSpeech() {
    try { speechSynthesis.cancel(); } catch (e) {}
    if (state.timer) { clearTimeout(state.timer); state.timer = null; }
  }
  function speak(item, idx, startChunk) {
    if (!("speechSynthesis" in window)) { showNotice("此浏览器不支持朗读。"); state.playing = false; updateNow(); return; }
    stopSpeech();
    var chunks = splitSentences(item.title + "。" + (item.summary || ""));
    var voice = pickVoice();
    var ci = startChunk || 0;
    function next() {
      if (!state.playing || idx !== state.index) return;
      state.chunk = ci;
      if (ci >= chunks.length) { state.timer = setTimeout(function () { playAt((idx + 1) % flat().length); }, 350); return; }
      var u = new SpeechSynthesisUtterance(chunks[ci]);
      u.lang = "zh-CN"; u.rate = state.rate; u.pitch = 1.0;
      if (voice) u.voice = voice;
      u.onend = function () { ci += 1; state.timer = setTimeout(next, 180); };
      u.onerror = function () { ci += 1; state.timer = setTimeout(next, 180); };
      speechSynthesis.speak(u);
    }
    next();
  }
  function playAt(i) {
    var items = flat();
    if (!items.length) return;
    state.index = i; state.playing = true; state.chunk = 0;
    if (!state.noticed) { showNotice("本期暂无预生成音频，浏览器朗读中（按句分段、优选自然女声）。"); state.noticed = true; }
    render();
    speak(items[i], i, 0);
  }
  function togglePlay() {
    var items = flat();
    if (!items.length) return;
    if (state.playing) { state.playing = false; stopSpeech(); render(); return; }
    state.playing = true;
    speak(items[state.index], state.index, state.chunk);
    render();
  }
  document.getElementById("btn-play").onclick = togglePlay;
  document.getElementById("btn-prev").onclick = function () { var f = flat(); if (f.length) playAt((state.index - 1 + f.length) % f.length); };
  document.getElementById("btn-next").onclick = function () { var f = flat(); if (f.length) playAt((state.index + 1) % f.length); };
  document.getElementById("rate-select").onchange = function (e) {
    state.rate = parseFloat(e.target.value);
    if (state.playing) { var f = flat(); speak(f[state.index], state.index, state.chunk); }
  };
  document.getElementById("voice-select").onchange = function (e) {
    state.voice = e.target.value;
    if (state.playing) { var f = flat(); speak(f[state.index], state.index, state.chunk); }
  };
  document.getElementById("btn-prevday").onclick = async function () {
    if (!state.date) return;
    var d = new Date(state.date + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - 1);
    var ds = d.toISOString().slice(0, 10);
    var j = await loadDate(ds);
    if (j) { state.data = j; state.date = j.date || ds; state.index = 0; state.view = { type: "home" }; state.playing = false; stopSpeech(); render(); }
    else showNotice("前一天暂无播报。");
  };
  document.getElementById("btn-nextday").onclick = async function () {
    if (!state.date) return;
    var d = new Date(state.date + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + 1);
    var ds = d.toISOString().slice(0, 10);
    if (ds > beijingDate(0)) return;
    var j = await loadDate(ds);
    if (j) { state.data = j; state.date = j.date || ds; state.index = 0; state.view = { type: "home" }; state.playing = false; stopSpeech(); render(); }
    else showNotice("后一天暂无播报。");
  };
  var themeSel = document.getElementById("theme-select");
  try {
    var saved = localStorage.getItem("news-theme");
    if (saved) { themeSel.value = saved; document.body.setAttribute("data-theme", saved); }
  } catch (e) {}
  themeSel.onchange = function (e) {
    document.body.setAttribute("data-theme", e.target.value);
    try { localStorage.setItem("news-theme", e.target.value); } catch (e2) {}
  };
  loadVoices();
  try { speechSynthesis.addEventListener("voiceschanged", loadVoices); } catch (e) {}
  loadLatest();
})();
</script>
</body>
</html>
